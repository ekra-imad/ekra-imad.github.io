<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Professional Portfolio</title>
    <style>
        /* Dark Theme Styling */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
            background-color: #0d1117; 
            color: #c9d1d9; 
            margin: 0; 
            padding: 40px 20px; 
            line-height: 1.6;
        }
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        header { 
            text-align: center; 
            border-bottom: 1px solid #21262d; 
            padding-bottom: 40px; 
            margin-bottom: 40px; 
        }
        h1 { 
            color: #58a6ff; 
            font-size: 2.5rem; 
            margin: 0 0 10px 0; 
        }
        .subtitle { 
            color: #8b949e; 
            font-size: 1.2rem; 
            margin: 0; 
        }
        h2 { 
            color: #f0f6fc; 
            border-bottom: 1px solid #30363d; 
            padding-bottom: 10px; 
        }
        /* Layout - Grid */
        .project-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }
        .project-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            padding: 24px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            transition: transform 0.2s, border-color 0.2s; 
        }
        .project-card:hover { 
            transform: translateY(-4px); 
            border-color: #58a6ff; 
        }
        .project-title { 
            color: #58a6ff; 
            margin: 0 0 10px 0; 
            font-size: 1.3rem; 
        }
        .project-desc { 
            color: #8b949e; 
            font-size: 0.95rem; 
            margin-bottom: 20px; 
            flex-grow: 1; 
        }
        .project-meta { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .project-lang { 
            background-color: #21262d; 
            color: #c9d1d9; 
            padding: 4px 10px; 
            border-radius: 12px; 
            font-size: 0.8rem; 
            font-weight: 600; 
        }
        .project-link { 
            color: #58a6ff; 
            text-decoration: none; 
            font-size: 0.9rem; 
            font-weight: 600; 
        }
        .project-link:hover { 
            text-decoration: underline; 
        }
        .loading { 
            text-align: center; 
            color: #8b949e; 
            font-style: italic; 
            grid-column: 1 / -1; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header>
            <h1 id="dev-name">Developer Portfolio</h1>
            <p class="subtitle">Welcome to my space. Below are my latest live GitHub projects, synchronized in real-time.</p>
        </header>

        <!-- Dynamic Projects Section -->
        <section>
            <h2>Open Source Projects</h2>
            <div class="project-grid" id="projects-container">
                <div class="loading">Fetching live repositories from GitHub...</div>
            </div>
        </section>
    </div>

    <script>
        // ==========================================
        const GITHUB_USERNAME = 'ekra-imad';

        // Set the header name automatically
        document.getElementById('dev-name').innerText = `${GITHUB_USERNAME}'s Portfolio`;

        async function loadGitHubProjects() {
            const container = document.getElementById('projects-container');
            try {
                // Fetch public repositories sorted by most recently updated
                const response = await fetch(`https://github.com{GITHUB_USERNAME}/repos?sort=updated&per_page=10`);
                
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const repos = await response.json();
                container.innerHTML = ''; // Remove loading message

                repos.forEach(repo => {
                    // Prevent portfolio code repository itself from showing up on the list
                    if (repo.name.toLowerCase() === `${GITHUB_USERNAME}.github.io`.toLowerCase()) return;
                    // Skip forks (repositories just copied from others) to keep it clean
                    if (repo.fork) return; 

                    // Create the HTML card structures dynamically
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    
                    card.innerHTML = `
                        <div>
                            <h3 class="project-title">${repo.name.replace(/-/g, ' ')}</h3>
                            <p class="project-desc">${repo.description || 'No description provided. Click below to explore the codebase.'}</p>
                        </div>
                        <div class="project-meta">
                            <span class="project-lang">${repo.language || 'Markdown/Docs'}</span>
                            <a href="${repo.html_url}" target="_blank" class="project-link">Explore Code →</a>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });

                if(container.children.length === 0) {
                    container.innerHTML = '<div class="loading">No public repositories found. Build some projects!</div>';
                }

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="loading">Oopsiii! Could not load projects right now. Please view them directly on my GitHub profile.</div>';
            }
        }

        
        loadGitHubProjects();
    </script>
</body>
</html>
